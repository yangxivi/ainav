<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XIVIAI 免费资源导航站</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<style>
  :root{
    --bg:#eef1f6;
    --surface:#f7f7f7;
    --card:#ffffff;
    --ink:#1f2937;
    --ink2:#6b7280;
    --line:#e5e5e5;
    --line2:#d0d0d0;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.04);
    --shadow-hover:0 10px 28px rgba(0,0,0,.08);
    --c-week:#e23b3b;
    --c-month:#f0922b;
    --c-year:#2ea3e0;
    --c-limit:#9b5de5;
    --c-free:#16a571;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--ink);margin:0;line-height:1.55;
    -webkit-font-smoothing:antialiased;padding-bottom:78px;
  }
  /* 动态背景层（最底层，铺满全屏） */
  .bg-anim{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

  /* 顶部栏 */
  .topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1200px;margin:0 auto;padding:13px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:13px;}
  .brand .logo{width:40px;height:40px;border-radius:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;box-shadow:none;border:1px solid var(--line);flex-shrink:0;}
  .brand .logo img{width:100%;height:100%;object-fit:cover;}
  .brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.5px;line-height:1.3;}
  .brand .sub{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.4;}
  .auto-badge{display:flex;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:700;
    color:#3a8f6c;background:#e9f5ef;border:1px solid #baddcd;padding:1px 7px;border-radius:0;width:100%;}
  .auto-badge .dot{width:6px;height:6px;border-radius:50%;background:#3a8f6c;animation:pulse 1.6s infinite;}
  .search-box{flex:1;max-width:380px;min-width:140px;position:relative;}
  .search-box input{width:100%;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink);outline:none;}
  .search-box input:focus{border-color:#2ea3e0;}
  .search-empty{position:absolute;top:40px;left:0;background:var(--card);border:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--ink2);box-shadow:var(--shadow);white-space:nowrap;z-index:70;}
  .search-empty.hidden{display:none;}
  .search-match{background:#fffbe6 !important;outline:2px solid #f0922b;outline-offset:-2px;position:relative;z-index:2;}
  .section.no-match{display:none;}
  .floating-qr{display:none;}
  @media (min-width:1280px){
    .floating-qr{display:block;position:fixed;top:92px;right:max(18px, calc(50vw - 918px));width:300px;background:var(--card);border:1px solid var(--line);padding:0;overflow:hidden;z-index:50;box-shadow:var(--shadow);text-align:center;}
    .floating-qr img{width:100%;height:auto;display:block;}
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .meta{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap;}
  .meta b{color:var(--ink);font-weight:700;}
  .legend{display:flex;gap:7px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2);}
  .legend i{width:9px;height:9px;border-radius:0;display:inline-block;}

  .wrap{max-width:1200px;margin:0 auto;padding:22px 22px 40px;position:relative;z-index:1;}

  /* 分类大卡片：无圆角，细线包裹 */
  .section{margin-bottom:28px;scroll-margin-top:70px;background:var(--surface);
    border:1px solid var(--line);border-radius:0;padding:0;box-shadow:var(--shadow);overflow:hidden;}
  .sec-head{display:flex;align-items:center;gap:10px;padding:16px 20px;
    border-bottom:1px solid var(--line);background:var(--card);}
  .sec-head .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .sec-head .ic svg,.tab .ti svg{width:100%;height:100%;display:block;}
  .sec-head .name{font-size:15.5px;font-weight:800;}
  .sec-head .count{margin-left:auto;font-size:12px;font-weight:700;color:var(--card);
    background:var(--accent);padding:3px 10px;border-radius:0;}
  .sec-head .hint{font-size:11.5px;color:var(--ink2);margin-left:6px;}

  /* 骨架屏 */
  .section.skeleton{background:var(--surface);padding-bottom:0;}
  .skeleton .sec-head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:0;}
  .skeleton .sh-line{height:22px;border-radius:0;width:160px;
    background:linear-gradient(90deg,#e5e0d5 25%,#f4f0e8 50%,#e5e0d5 75%);background-size:200% 100%;
    animation:shimmer 1.4s infinite;}
  .skeleton-card{background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0;}
  .sk{border-radius:0;
    background:linear-gradient(90deg,#e5e0d5 25%,#f4f0e8 50%,#e5e0d5 75%);background-size:200% 100%;
    animation:shimmer 1.4s infinite;}
  .sk-title{width:40px;height:40px;}
  .sk-text1{width:70%;height:12px;}.sk-text2{width:55%;height:12px;}.sk-text3{width:40%;height:12px;}
  .sk-btn{height:30px;width:100%;margin-top:auto;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .fade-out{opacity:0;transition:opacity .25s ease;pointer-events:none;}

  /* 4×4 栅格：卡片无圆角、无线阴影，用细线分隔 */
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);}
  .card{background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:18px 16px;display:flex;flex-direction:column;align-items:stretch;gap:10px;position:relative;
    transition:background .15s ease;min-height:180px;min-width:0;overflow:hidden;}
  .card:hover{background:#fdfcfa;box-shadow:var(--shadow-hover);z-index:1;}

  /* 卡片内部栅格 */
  .card .card-head{display:flex;align-items:flex-start;gap:10px;}
  .card .ava{width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    overflow:hidden;border:1px solid var(--line);background:#fff;position:relative;}
  .card .ava .favicon{width:100%;height:100%;object-fit:contain;padding:4px;background:#fff;}
  .card .ava .fallback{display:block;width:100%;height:100%;object-fit:contain;padding:3px;background:#fff;}
  .card .title-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .card .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}

  .card .nm{font-size:14.5px;font-weight:800;line-height:1.25;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .exp{flex:0 0 auto;font-size:10px;font-weight:800;color:var(--accent);white-space:nowrap;
    border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));padding:2px 7px;background:#fff;}
  .card .new-tag{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;line-height:18px;font-weight:800;color:#e53e3e;border:1px solid #e53e3e;border-radius:4px;
    padding:0 7px;background:#fff;white-space:nowrap;letter-spacing:0;
    margin-left:6px;animation:newPulse 1.8s ease-in-out infinite;}
  @keyframes newPulse{0%,100%{box-shadow:0 0 0 0 rgba(229,62,62,0.0);}50%{box-shadow:0 0 0 3px rgba(229,62,62,0.18);}}
  .card .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:10px;font-weight:700;padding:1px 6px;line-height:1.6;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tag.pf{color:#4b5563;background:#f4f2ee;border:1px solid var(--line);}
  .tag.tp{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff);
    border:1px solid color-mix(in srgb,var(--accent) 28%,#fff);}
  .card .ds{font-size:12.5px;color:var(--ink2);line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:58px;}
  .card .get{margin-top:auto;width:100%;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    color:var(--card);background:var(--accent);border:none;border-radius:0;padding:8px 10px;cursor:pointer;
    transition:filter .15s;justify-content:center;}
  .card .get:hover{filter:brightness(1.15);}
  .card .get .arr{margin-left:auto;font-weight:900;}
  .card.hidden{display:none;}
  .card.placeholder{background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:none;opacity:.7;}
  .card.placeholder .placeholder-inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .card.placeholder .placeholder-dots{font-size:22px;letter-spacing:3px;color:var(--line2);line-height:1;}
  .card.placeholder .placeholder-text{font-size:12.5px;font-weight:700;color:#c1c1c1;}

  .more{grid-column:1 / -1;justify-self:stretch;border:none;border-top:1px dashed var(--line2);
    color:var(--ink2);background:transparent;font-weight:700;font-size:13px;padding:13px;cursor:pointer;
    transition:.15s;text-align:center;}
  .more:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 4%,transparent);}

  /* 浮动返回顶部 */
  .totop{position:fixed;right:20px;bottom:92px;z-index:70;width:44px;height:44px;border-radius:0;
    background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-hover);
    cursor:pointer;font-size:18px;display:none;align-items:center;justify-content:center;
    transition:opacity .2s,transform .2s;}
  .totop:hover{transform:translateY(-2px);color:var(--c-free);}
  @media (min-width:1280px){
    .totop{right:auto;left:calc(100vw - max(18px, 50vw - 918px) - 300px);}
  }

  /* 底部菜单栏 */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:65;background:#fff;
    border-top:1px solid var(--line);}
  .tabbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:0;
    padding:0 22px;overflow-x:auto;justify-content:space-evenly;}
  .tab{flex:1 1 0;min-width:0;padding:10px 2px;cursor:pointer;
    font-size:12px;font-weight:700;color:var(--ink2);transition:.15s;
    border:none;border-bottom:2px solid transparent;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;position:relative;}
  .tab .ti{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:inherit;flex-shrink:0;}
  .tab .ti svg{width:100%;height:100%;display:block;}
  .tab > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .tab:not(.active):hover{background:rgba(0,0,0,.03);}
  .tab.active{color:#fff;background:var(--accent);border-bottom-color:var(--accent);}
  .tab.active .ti svg{stroke:#fff;}

  /* 领取弹窗 */
  .modal-backdrop{position:fixed;inset:0;z-index:110;background:rgba(40,32,24,.5);
    display:none;align-items:center;justify-content:center;padding:18px;
    opacity:0;transition:opacity .2s ease;}
  .modal-backdrop.show{display:flex;opacity:1;}
  .modal{width:100%;max-width:520px;background:var(--surface);border-radius:0;box-shadow:var(--shadow-hover);
    overflow:hidden;transform:translateY(10px);transition:transform .2s ease;border:1px solid var(--line2);}
  .modal-backdrop.show .modal{transform:translateY(0);}
  .modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;
    border-bottom:1px solid var(--line);background:var(--card);}
  .modal-head .ic{font-size:22px;width:38px;height:38px;overflow:hidden;
    background:color-mix(in srgb,var(--mcolor) 12%,#fff);display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);position:relative;}
  .modal-head .ic .favicon{width:100%;height:100%;object-fit:contain;padding:3px;background:#fff;}
  .modal-head .ic .fallback{display:block;width:100%;height:100%;object-fit:contain;padding:3px;background:#fff;}
  .modal-head .tt{flex:1;}
  .modal-head .tt h3{margin:0;font-size:16px;font-weight:800;}
  .modal-head .tt p{margin:2px 0 0;font-size:12px;color:var(--ink2);}
  .modal-head .close{width:32px;height:32px;border-radius:0;border:1px solid var(--line);background:#fff;
    cursor:pointer;font-size:18px;color:var(--ink2);display:flex;align-items:center;justify-content:center;transition:.15s;}
  .modal-head .close:hover{background:#f3f4f6;color:var(--ink);}
  .modal-body{padding:16px 18px 20px;}
  .modal-body .exp{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
    color:var(--mcolor);background:color-mix(in srgb,var(--mcolor) 10%,#fff);border:1px solid color-mix(in srgb,var(--mcolor) 30%,#fff);
    padding:3px 10px;border-radius:0;margin-bottom:14px;}
  .steps{margin:0 0 18px;padding:0;list-style:none;}
  .steps li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink);margin-bottom:10px;}
  .steps li:last-child{margin-bottom:0;}
  .steps .num{flex:0 0 22px;height:22px;display:flex;align-items:center;justify-content:center;
    background:var(--mcolor);color:#fff;font-size:11px;font-weight:800;margin-top:1px;}
  .steps .txt{color:var(--ink2);line-height:1.55;}
  .link-wrap{background:var(--card);border:1px solid var(--line);border-radius:0;padding:14px;}
  .link-wrap .lb{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .link-row{display:flex;gap:8px;}
  .link-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:0;padding:9px 11px;font-size:13px;color:var(--ink);background:#fff;}
  .link-row button{white-space:nowrap;border:none;border-radius:0;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;}
  .btn-copy{background:var(--mcolor);color:#fff;}
  .btn-copy:hover{filter:brightness(1.07);}
  .btn-open{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;}
  .btn-open:hover{background:#e2e8f0;}
  .copy-toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);
    background:rgba(31,41,55,.9);color:#fff;font-size:13px;font-weight:700;padding:8px 16px;border-radius:0;
    opacity:0;pointer-events:none;transition:.2s;z-index:120;}
  .copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============ 响应式：电脑/笔记本/平板/手机 ============ */
  /* 笔记本小屏：4 列收窄边距 */
  @media (max-width:1200px){
    .wrap{padding:20px 18px 40px;}
  }
  /* 平板（横屏）：3 列 */
  @media (max-width:1024px){
    .wrap{padding:18px 16px 40px;}
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .sec-head .hint{display:none;}
  }
  /* 平板（竖屏）/ 手机：单排单列卡片，去掉悬浮公众号二维码 */
  @media (max-width:768px){
    .grid{grid-template-columns:1fr;border-left:none;border-top:none;}
    .card{padding:14px 15px;min-height:0;gap:9px;}
    .card-head{gap:11px;}
    .card .ava{width:38px;height:38px;flex:0 0 auto;}
    .card .nm{font-size:14.5px;line-height:1.35;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    .card .ds{font-size:12.5px;line-height:1.6;-webkit-line-clamp:3;}
    .card .get{font-size:13px;padding:9px 12px;}
    .floating-qr{display:none!important;}
    .sec-head{flex-wrap:wrap;gap:6px 10px;padding:14px 16px;}
    .topbar-inner{padding:11px 14px;}
    .search-box{order:2;width:100%;max-width:none;margin-top:6px;}
    .meta{width:100%;justify-content:flex-start;order:3;font-size:11.5px;}
    .legend{font-size:10.5px;gap:6px;}
  }
  /* 手机：单列布局 + 整体紧凑自适应 */
  @media (max-width:560px){
    body{padding-bottom:64px;}
    .topbar-inner{padding:9px 12px;gap:10px;}
    .brand{gap:9px;}
    .brand .logo{width:34px;height:34px;}
    .brand h1{font-size:14.5px;letter-spacing:0;}
    .brand .sub{font-size:10.5px;}
    .auto-badge{font-size:10px;padding:1px 6px;line-height:1.5;}
    .search-box input{height:34px;font-size:13px;}
    .meta{font-size:11px;gap:10px;}
    .legend{font-size:10px;gap:5px;}
    .legend i{width:7px;height:7px;}
    .wrap{padding:12px 12px 24px;}
    .section{margin-bottom:16px;border-radius:0;}
    .sec-head{padding:11px 14px;gap:8px;}
    .sec-head .ic{width:18px;height:18px;}
    .sec-head .name{font-size:13.5px;}
    .sec-head .count{font-size:11px;padding:2px 8px;}
    /* 单列：卡片更宽、更紧凑 */
    .grid{grid-template-columns:1fr;border-left:none;border-top:none;}
    .card{padding:13px 14px;min-height:0;gap:10px;}
    .card:hover{box-shadow:none;background:#fafaf8;}
    .card-head{gap:11px;}
    .card .ava{width:38px;height:38px;flex:0 0 auto;}
    .card .nm{font-size:14px;line-height:1.35;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    .card .exp{font-size:10.5px;padding:2px 7px;flex-shrink:0;}
    .card .new-tag{font-size:10.5px;line-height:16px;padding:0 6px;}
    .card .tags{display:flex;gap:5px;flex-wrap:wrap;}
    .tag{font-size:10.5px;padding:2px 7px;line-height:1.5;}
    .card .ds{font-size:12px;line-height:1.65;min-height:0;-webkit-line-clamp:3;}
    .card .get{font-size:13px;padding:9px 12px;}
    .more{font-size:12.5px;padding:11px;}
    /* 悬浮元素：移动端隐藏 */
    .floating-qr{display:none!important;}
    .totop{right:14px;bottom:70px;width:40px;height:40px;font-size:16px;}
    .tabbar-inner{padding:0 6px;}
    .tab{padding:7px 2px;font-size:10.5px;gap:2px;}
    .tab .ti{width:16px;height:16px;}
    /* 弹窗紧凑 */
    .modal-backdrop{padding:10px;align-items:flex-end;}
    .modal{max-width:100%;}
    .modal-head{padding:13px 14px 11px;}
    .modal-head .ic{width:34px;height:34px;}
    .modal-head .tt h3{font-size:14.5px;}
    .modal-body{padding:14px 14px 18px;}
    .modal-body .exp{font-size:11.5px;padding:2px 9px;}
    .steps li{font-size:12.5px;gap:9px;margin-bottom:9px;}
    .steps .num{flex:0 0 20px;height:20px;font-size:10.5px;}
    .link-row input{font-size:12.5px;padding:8px 10px;}
    .link-row button{padding:8px 11px;font-size:11.5px;}
  }
  /* 超小手机（<=400px）：进一步压缩 */
  @media (max-width:400px){
    .topbar-inner{padding:8px 10px;}
    .brand .logo{width:30px;height:30px;}
    .brand h1{font-size:13.5px;}
    .auto-badge{font-size:9.5px;padding:1px 5px;}
    .wrap{padding:10px 10px 20px;}
    .card{padding:12px 12px;}
    .card .nm{font-size:13.5px;}
    .card .ds{font-size:11.5px;}
    .tag{font-size:10px;padding:1px 6px;}
  }
  /* 弹窗在窄屏优化 */
  @media (max-width:640px){
    .modal-head .tt h3{font-size:14px;}
    .link-row{flex-wrap:wrap;}
    .link-row input{width:100%;}
  }
</style>
</head>
<body>
  <!-- 动态背景层：带 SMIL 动画的 SVG，铺满全屏、置于最底层 -->
  <svg class="bg-anim" version="1.1" baseProfile="full" width="100%" height="100%"

/* 日期与分类工具 */
function dayStart(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
const TODAY = dayStart(new Date());
const TODAY_STR = TODAY.getFullYear()+"-"+String(TODAY.getMonth()+1).padStart(2,"0")+"-"+String(TODAY.getDate()).padStart(2,"0");
function parseEnd(s){
  if(s==="FREE" || s==="LIMIT") return s;
  const d = dayStart(new Date(s));
  return isNaN(d.getTime()) ? "LIMIT" : d;
}
function daysUntil(end){
  if(end==="FREE" || end==="LIMIT") return Infinity;
  return Math.ceil((end - TODAY) / (86400000));
}
function classify(end){
  if(end==="FREE") return "free";
  if(end==="LIMIT") return "limit";
  const d = daysUntil(end);
  if(d<=7) return "week";
  if(d<=30) return "month";
  if(end.getFullYear()===TODAY.getFullYear()) return "year";
  return "limit";
}
function fmtExp(end){
  if(end==="FREE") return "永久";
  if(end==="LIMIT") return "限时";
  const d = daysUntil(end);
  if(d<0) return "已到期";
  if(d===0) return "今天";
  if(d===1) return "明天";
  if(d<=30) return d+"天后";
  const m=end.getMonth()+1, day=end.getDate();
  if(m===12 && day===31) return "2026年底";
  return `${m}月${day}日`;
}

/* 自动分组并排序 */
const DATA = {};
function buildData(raw){
  CATS.forEach(c=>DATA[c.key]=[]);
  raw.forEach(it=>{
    it._end = parseEnd(it.end);
    it._exp = fmtExp(it._end);
    const key = classify(it._end);
    DATA[key].push(it);
  });
  CATS.forEach(c=>{
    DATA[c.key].sort((a,b)=>{
      if(a._end===b._end) return 0;
      if(a._end==="FREE" || a._end==="LIMIT") return 1;
      if(b._end==="FREE" || b._end==="LIMIT") return -1;
      return a._end - b._end;
    });
  });
}

/* favicon / logo 图标（多源 fallback：DuckDuckGo -> Google -> 官网 /favicon.ico -> 本站 logo） */
function domainFromUrl(url){
  if(!url || url==="#") return "";
  try {
    const u = new URL(url.startsWith("http") ? url : "https://"+url);
    return u.hostname.replace(/^www\./, "");
  } catch { return ""; }
}
function faviconSrcs(url, size=64){
  const d = domainFromUrl(url);
  if(!d) return [];
  return [
    `https://icons.duckduckgo.com/ip3/${encodeURIComponent(d)}.ico`,
    `https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=${size}`,
    `https://${d}/favicon.ico`
  ];
}
/* 图标策略：默认显示本站黑猫 logo 占位，favicon 加载成功后无缝替换，失败维持黑猫 */
function iconHtml(it){
  const ico = encodeURIComponent(getUrl(it));
  return `<img class="favicon" src="logo.jpg" alt="" data-ico="${ico}">`;
}
function setIcon(el, it){
  const ico = encodeURIComponent(getUrl(it));
  el.innerHTML = `<img class="favicon" src="logo.jpg" alt="" data-ico="${ico}">`;
  loadFavicon(el.querySelector("img.favicon"));
}
function loadFavicon(img){
  if(!img) return;
  const url = decodeURIComponent(img.dataset.ico || "");
  const srcs = faviconSrcs(url, 64);
  if(!srcs.length) return; // 维持黑猫占位
  let i = 0;
  const tryNext = () => {
    if(i >= srcs.length) return; // 全部失败 -> 维持黑猫
    const t = new Image();
    t.onload = () => { img.src = srcs[i]; };
    t.onerror = () => { i++; tryNext(); };
    t.src = srcs[i];
  };
  tryNext();
}
function preloadFavicons(){
  document.querySelectorAll(".ava img.favicon, .ic img.favicon").forEach(loadFavicon);
}

function makeSteps(it){
  const g = it.get, steps = ["打开下方「官方领取地址」"];
  if(/注册|账号|邮箱|登录/.test(g)) steps.push("使用邮箱或手机号完成注册/登录");
  if(/实名|学生|edu/.test(g)) steps.push("按页面要求完成认证（实名 / 学生 / 组织）");
  if(/控制台|领取中心|活动页/.test(g)) steps.push(`进入「${g.replace(/领取|进入/g,"").trim()}」找到该资源`);
  if(/下载|安装/.test(g)) steps.push("下载安装对应客户端");
  if(/邀请码/.test(g)) steps.push("输入有效邀请码并提交");
  if(/充值赠|充值/.test(g)) steps.push("完成首次充值后自动发放赠送额度");
  steps.push("按页面提示领取免费额度，即可开始使用");
  return steps;
}

function openModal(it, accent){
  const back = document.getElementById("modalBack");
  const modal = document.getElementById("modal");
  const url = getUrl(it);
  modal.style.setProperty("--mcolor", accent);
  setIcon(document.getElementById("mIcon"), it, 64);
  document.getElementById("mTitle").textContent = it.nm;
  const newBadge = (it.ad && it.ad===TODAY_STR) ? '<span class="new-tag" style="margin-left:6px;" title="今日新增">新</span>' : '';
  document.getElementById("mSub").innerHTML = `${it.pf} · ${it.tp} · 到期：${it._exp}${newBadge}`;
  document.getElementById("mExp").textContent = "⏳ 到期时间：" + it._exp;
  document.getElementById("mUrl").value = url;
  const ol = document.getElementById("mSteps");
  ol.innerHTML = makeSteps(it).map((s,i)=>
    `<li><span class="num">${i+1}</span><span class="txt">${s}</span></li>`
  ).join("");
  document.getElementById("mOpen").onclick = () => {
    if(url && url !== "#") window.open(url, "_blank", "noopener,noreferrer");
    else alert("暂无官方链接");
  };
  document.getElementById("mCopy").onclick = () => copyLink(url);
  back.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  document.getElementById("modalBack").classList.remove("show");
  document.body.style.overflow = "";
}

function copyLink(text){
  if(!text || text==="#") return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(showCopyToast);
  } else {
    const t = document.createElement("textarea"); t.value=text; t.style.position="fixed"; t.style.opacity=0;
    document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t); showCopyToast();
  }
}
function showCopyToast(){
  const toast = document.getElementById("copyToast");
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1600);
}

document.getElementById("mClose").addEventListener("click", closeModal);
document.getElementById("modalBack").addEventListener("click", e => { if(e.target.id === "modalBack") closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

function renderReal(){

        const it = items[i];

          <div class="card-head">

                <div class="nm">${it.nm}</div>

        more.textContent = !open ? `收起 ▴` : `更多 ${items.length-MAX} 项 ▾`;

    const tab = document.createElement("div");

    tab.addEventListener("click",()=>{
      document.getElementById("sec-"+cat.key).scrollIntoView({behavior:"smooth",block:"start"});

    totop.style.display = window.scrollY > 400 ? "flex" : "none";
  });
  totop.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

  const tabs = [...tabbar.querySelectorAll(".tab")];
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        tabs.forEach(t=>t.classList.toggle("active", t.dataset.target===e.target.id));
      }
    });
  },{rootMargin:"-45% 0px -50% 0px"});
  CATS.forEach(c=>obs.observe(document.getElementById("sec-"+c.key)));
  initSearch();
}

function initSearch(){
  const input = document.getElementById("search");
  const empty = document.getElementById("search-empty");
  if(!input || !empty) return;

  input.addEventListener("input",()=>{
    const kw = input.value.trim().toLowerCase();
    const cards = [...document.querySelectorAll(".card:not(.placeholder)")];
    const sections = [...document.querySelectorAll(".section")];
    empty.classList.add("hidden");

    if(!kw){
      cards.forEach(c=>{
        c.classList.remove("search-match");
        c.classList.toggle("hidden", c.dataset.fold === "1");
      });
      sections.forEach(s=>s.classList.remove("no-match"));
      document.querySelectorAll(".more").forEach(m=>{
        m.dataset.open = "false";
        const count = m.closest(".grid").querySelectorAll("[data-fold]").length;
        m.textContent = `更多 ${count} 项 ▾`;
      });
      return;
    }

    let matchCount = 0;
    let firstMatch = null;
    cards.forEach(c=>{
      const match = c.innerText.toLowerCase().includes(kw);
      if(match){
        c.classList.remove("hidden");
        c.classList.add("search-match");
        matchCount++;
        if(!firstMatch) firstMatch = c;
      } else {
        c.classList.add("hidden");
        c.classList.remove("search-match");
      }
    });

    cards.filter(c=>c.classList.contains("search-match") && c.dataset.fold==="1").forEach(c=>{
      const grid = c.closest(".grid");
      const more = grid.querySelector(".more");
      if(more){
        more.dataset.open = "true";
        more.textContent = "收起 ▴";
        grid.querySelectorAll("[data-fold]").forEach(fc=>fc.classList.remove("hidden"));
      }
    });

    sections.forEach(sec=>{
      const hasMatch = sec.querySelector(".card:not(.placeholder):not(.hidden)") !== null;
      sec.classList.toggle("no-match", !hasMatch);
    });

    if(matchCount === 0){
      empty.classList.remove("hidden");
    } else if(firstMatch){
      firstMatch.scrollIntoView({behavior:"smooth", block:"center"});
    }
  });
}

/* 立即用内嵌兜底数据渲染：用户体感零等待，不再卡骨架屏
   同时后台异步拉最新 data.json，拉到后平滑替换 + 更新"更新"时间戳 */
buildData(RAW_FALLBACK);
renderReal();
document.body.dataset.state = "ready";

(async ()=>{
  const SOURCES = [
    './data.json',
    'https://cdn.jsdelivr.net/gh/yangxivi/ainav@main/data.json',
    'https://raw.githubusercontent.com/yangxivi/ainav/main/data.json'
  ];
  for(const url of SOURCES){
    try {
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 5000);
      const resp = await fetch(url, {cache:'no-store', signal:ctrl.signal});
      clearTimeout(t);
      if(resp.ok){
        const j = await resp.json();
        if(Array.isArray(j) && j.length){
          // 比较新数据与当前渲染，是否真的有更新（条目数 / 第一条 nm）
          const cur = document.getElementById("total");
          const newSig = j.length + "|" + (j[0]?.nm || "") + "|" + (j[0]?.end || "");
          if(cur && cur.dataset.sig !== newSig){
            cur.dataset.sig = newSig;
            buildData(j);
            renderReal();
          }
          break;
        }
      }
    } catch(e){ /* 静默尝试下一个源，不打扰用户 */ }
  }
})();
</script>
</body>
</html>
